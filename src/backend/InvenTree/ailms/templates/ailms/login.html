{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Procurement System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">AI Procurement System</h1>
            <p class="text-gray-600">Sign in to continue</p>
        </div>
        
        {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
            <p class="font-semibold">Login failed</p>
            <p class="text-sm">Please check your username and password.</p>
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'ailms:login' %}{% if next %}?next={{ next }}{% endif %}">
            {% csrf_token %}
            
            <div class="mb-4">
                <label for="id_username" class="block text-gray-700 font-semibold mb-2">
                    Username
                </label>
                <input 
                    type="text" 
                    name="username" 
                    id="id_username"
                    required
                    autofocus
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your username"
                >
            </div>
            
            <div class="mb-6">
                <label for="id_password" class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>
                <input 
                    type="password" 
                    name="password" 
                    id="id_password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your password"
                >
            </div>
            
            <input type="hidden" name="next" value="{{ next }}">
            
            <button 
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors"
            >
                Sign In
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-600">
            <p>Powered by InvenTree AI Procurement</p>
        </div>
    </div>
</body>
</html>
